name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun test tests/
      - run: |
          for f in hooks/pre/worktree-guard.ts extensions/wt.ts; do
            bun -e "await import('./$f')" || exit 1
          done
